<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agrocarnes</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">Agrocarnes</span>
    <nav id="nav" hidden>
      <a href="#inventario" data-view="inventario">Inventario</a>
      <a href="#compras" data-view="compras">Compras</a>
      <a href="#gastos" data-view="gastos">Gastos</a>
      <a href="#traslados" data-view="traslados">Traslados</a>
      <a href="#formulacion" data-view="formulacion">Formulación</a>
      <a href="#ventas" data-view="ventas">Ventas</a>
      <a href="#cartera" data-view="cartera">Cartera</a>
      <a href="#notas-credito" data-view="notas-credito">Notas crédito</a>
      <a href="#informes" data-view="informes">Informes</a>
      <a href="#configuracion" data-view="configuracion">Configuración</a>
    </nav>
    <div class="spacer"></div>
    <div id="user-box" class="user-box" hidden>
      <span id="user-name"></span>
      <button id="logout" class="btn-link">Salir</button>
    </div>
  </header>

  <main id="app">
    <section id="login-view" class="login">
      <h1>Iniciar sesión</h1>
      <form id="login-form">
        <label>Correo <input type="email" name="email" required autocomplete="username" /></label>
        <label>Contraseña <input type="password" name="password" required autocomplete="current-password" /></label>
        <button type="submit" class="btn-primary">Entrar</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </section>

    <section id="content-view" hidden></section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <!-- Solo para exportar tablas a Excel (.xlsx) desde el navegador; nada del
       resto de la app depende de librerías externas. Se sirve local (no CDN)
       para no depender de la red del cliente ni de terceros. -->
  <script src="js/vendor/xlsx.full.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
