<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agrocarnes</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">Agrocarnes</span>
    <nav id="nav" hidden>
      <button data-view="inventario">Inventario</button>
      <button data-view="compras">Compras</button>
      <button data-view="traslados">Traslados</button>
      <button data-view="produccion">Producción</button>
      <button data-view="ventas">Ventas</button>
    </nav>
  </header>

  <main id="app">
    <section id="login-view">
      <h1>Iniciar sesión</h1>
      <form id="login-form">
        <label>Email <input type="email" name="email" required /></label>
        <label>Contraseña <input type="password" name="password" required /></label>
        <button type="submit">Entrar</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </section>

    <section id="content-view" hidden>
      <p>Sesión iniciada. Esta pantalla se va llenando módulo por módulo.</p>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
